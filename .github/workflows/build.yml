name: Cloud Build ESign (Ksign Full Replica IPA)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Отображаемое имя приложения (CFBundleDisplayName)"
        required: false
        default: "ESign"
        type: string
      bundle_id:
        description: "Bundle Identifier (например p3.xyz.yyyue.esign)"
        required: false
        default: "p3.xyz.yyyue.esign"
        type: string
      app_version:
        description: "Версия приложения (CFBundleShortVersionString)"
        required: false
        default: "5.0.2"
        type: string
      create_release:
        description: "Опубликовать готовый IPA в GitHub Releases"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned & Signed IPA on macOS
    runs-on: macos-15
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Clone Upstream Open-Source ESign Replica (Nyasami/Ksign) with Submodules
        run: |
          if [ ! -d "Ksign.xcodeproj" ]; then
            echo "Cloning Nyasami/Ksign with Zsign and IDeviceKit submodules..."
            git clone --recurse-submodules https://github.com/Nyasami/Ksign.git upstream_ksign
          else
            git submodule update --init --recursive
            ln -s . upstream_ksign
          fi

      - name: Select Latest Stable Xcode
        run: |
          if ls -d /Applications/Xcode_26*.app 1> /dev/null 2>&1; then
            LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
            echo "Selecting latest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            echo "Selecting default Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Patch Swift 6 Concurrency & Dependencies in Ksign
        run: |
          cd upstream_ksign
          echo "Patching Swift 6 Sendable and iOS SDK incompatibilities..."
          python3 -c "
          import os, re
          for root, _, files in os.walk('.'):
              for f in files:
                  if f.endswith('.swift'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          txt = fp.read()
                      new_txt = re.sub(r'\.glassEffect\(.*', '', txt)
                      new_txt = new_txt.replace('case parsingError(Any)', 'case parsingError(any Sendable)')
                      if new_txt != txt:
                          with open(path, 'w', encoding='utf-8') as fp:
                              fp.write(new_txt)
                          print(f'Patched {path}')
          "
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.0/swift-tools-version: 5.9/g' {} +

      - name: Apply Custom App Name, Version & Bundle ID
        env:
          CUSTOM_NAME: ${{ inputs.app_name || 'ESign' }}
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id || 'p3.xyz.yyyue.esign' }}
          CUSTOM_VERSION: ${{ inputs.app_version || '5.0.2' }}
        run: |
          cd upstream_ksign
          echo "Applying Display Name: $CUSTOM_NAME, Bundle ID: $CUSTOM_BUNDLE_ID, Version: $CUSTOM_VERSION"
          if [ -f "Ksign.xcodeproj/project.pbxproj" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = ${CUSTOM_BUNDLE_ID}/g" Ksign.xcodeproj/project.pbxproj || true
            sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${CUSTOM_VERSION}/g" Ksign.xcodeproj/project.pbxproj || true
          fi

      - name: Download Local HTTPS OTA Installer Certificates (backloop.dev)
        run: |
          cd upstream_ksign
          rm -rf deps || true
          mkdir -p deps
          curl -L -o deps/server.crt https://backloop.dev/backloop.dev-cert.crt || true
          curl -L -o deps/server.key1 https://backloop.dev/backloop.dev-key.part1.pem || true
          curl -L -o deps/server.key2 https://backloop.dev/backloop.dev-key.part2.pem || true
          cat deps/server.key1 deps/server.key2 > deps/server.pem 2>/dev/null || true
          rm -f deps/server.key1 deps/server.key2
          echo "*.backloop.dev" > deps/commonName.txt

      - name: Build & Package Unsigned IPA
        env:
          CUSTOM_NAME: ${{ inputs.app_name || 'ESign' }}
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id || 'p3.xyz.yyyue.esign' }}
          CUSTOM_VERSION: ${{ inputs.app_version || '5.0.2' }}
        run: |
          cd upstream_ksign
          TMP_BUILD="$(mktemp -d)"
          STAGE_DIR="$TMP_BUILD/stage"

          xcodebuild \
            -project Ksign.xcodeproj \
            -scheme "Ksign" \
            -configuration Release \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath "$TMP_BUILD" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            SWIFT_STRICT_CONCURRENCY=minimal

          APP_PATH="$TMP_BUILD/Build/Products/Release-iphoneos/Ksign.app"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/Ksign.app"

          # Patch Info.plist with custom Display Name, Bundle ID, and Version
          PLIST="$STAGE_DIR/Payload/Ksign.app/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $CUSTOM_NAME" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $CUSTOM_NAME" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $CUSTOM_BUNDLE_ID" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $CUSTOM_VERSION" "$PLIST" || true
          fi

          chmod -R 0755 "$STAGE_DIR/Payload/Ksign.app"
          codesign --force --sign - --timestamp=none "$STAGE_DIR/Payload/Ksign.app"
          cp deps/* "$STAGE_DIR/Payload/Ksign.app/" || true
          rm -rf "$STAGE_DIR/Payload/Ksign.app/_CodeSignature"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$STAGE_DIR"
          zip -r9 "$GITHUB_WORKSPACE/output/ESign-unsigned.ipa" Payload

      - name: Optional Cloud Signing with Certificate Secrets (Zsign)
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
          CUSTOM_NAME: ${{ inputs.app_name || 'ESign' }}
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id || 'p3.xyz.yyyue.esign' }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "Secrets P12_BASE64 or PROVISION_BASE64 are not configured. Skipping cloud signing."
            exit 0
          fi
          echo "Signing IPA using provided P12 and MobileProvision secrets..."
          brew install openssl pkg-config
          git clone https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign
          g++ -std=c++11 *.cpp common/*.cpp -o zsign \
            -I$(brew --prefix openssl)/include \
            -L$(brew --prefix openssl)/lib \
            -lcrypto -lz -O3

          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$PROVISION_BASE64" | base64 --decode > /tmp/cert.mobileprovision

          /tmp/zsign/zsign \
            -k /tmp/cert.p12 \
            -p "$P12_PASSWORD" \
            -m /tmp/cert.mobileprovision \
            -n "$CUSTOM_NAME" \
            -b "$CUSTOM_BUNDLE_ID" \
            -o "$GITHUB_WORKSPACE/output/ESign-signed.ipa" \
            -z 9 \
            "$GITHUB_WORKSPACE/output/ESign-unsigned.ipa"

          rm -f /tmp/cert.p12 /tmp/cert.mobileprovision

      - name: Upload Built IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESign-IPA-Build
          path: output/*.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (Optional)
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.app_version || '5.0.2' }}-build.${{ github.run_number }}
          name: "${{ inputs.app_name || 'ESign' }} v${{ inputs.app_version || '5.0.2' }} (Build #${{ github.run_number }})"
          files: output/*.ipa
          generate_release_notes: true
