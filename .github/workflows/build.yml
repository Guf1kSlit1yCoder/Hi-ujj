name: Build ESign IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip if present
        run: |
          if [ -f "ESign_Cloud_Build_Source.zip" ]; then
            unzip -o ESign_Cloud_Build_Source.zip
          fi

      - name: Clone Ksign & Build Unsigned IPA
        run: |
          git clone --recurse-submodules https://github.com/Nyasami/Ksign.git ksign_build
          cd ksign_build
          mkdir -p deps
          curl -L -o deps/server.crt https://backloop.dev/backloop.dev-cert.crt || true
          curl -L -o deps/server.key1 https://backloop.dev/backloop.dev-key.part1.pem || true
          curl -L -o deps/server.key2 https://backloop.dev/backloop.dev-key.part2.pem || true
          cat deps/server.key1 deps/server.key2 > deps/server.pem 2>/dev/null || true
          rm -f deps/server.key1 deps/server.key2
          echo "*.backloop.dev" > deps/commonName.txt

          TMP_BUILD="$(mktemp -d)"
          xcodebuild \
            -project Ksign.xcodeproj \
            -scheme "Ksign" \
            -configuration Release \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath "$TMP_BUILD" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO

          mkdir -p "$TMP_BUILD/stage/Payload" "$GITHUB_WORKSPACE/output"
          cp -R "$TMP_BUILD/Build/Products/Release-iphoneos/Ksign.app" "$TMP_BUILD/stage/Payload/Ksign.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ESign" "$TMP_BUILD/stage/Payload/Ksign.app/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier p3.xyz.yyyue.esign" "$TMP_BUILD/stage/Payload/Ksign.app/Info.plist" || true
          chmod -R 0755 "$TMP_BUILD/stage/Payload/Ksign.app"
          codesign --force --sign - --timestamp=none "$TMP_BUILD/stage/Payload/Ksign.app"
          cp deps/* "$TMP_BUILD/stage/Payload/Ksign.app/" || true
          rm -rf "$TMP_BUILD/stage/Payload/Ksign.app/_CodeSignature"
          cd "$TMP_BUILD/stage"
          zip -r9 "$GITHUB_WORKSPACE/output/ESign-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESign-IPA
          path: output/ESign-unsigned.ipa
